name = "tourmesh"
main = "dist/server/index.js"
compatibility_date = "2025-09-01"
# build-market.mjs already bundles the worker with all assets embedded.
no_bundle = true

[[d1_databases]]
binding = "DB"
database_name = "tourmesh"
database_id = "9c4f04ac-2f21-40bb-9223-fd9a0bd8fae9"
migrations_dir = "drizzle"

# Photo storage. Disabled until R2 is enabled in the Cloudflare dashboard;
# without it offers work, only photo upload answers 503.
# Then: `npx wrangler r2 bucket create tourmesh-photos` and uncomment.
# [[r2_buckets]]
# binding = "BUCKET"
# bucket_name = "tourmesh-photos"
