name = "tourmesh"
main = "dist/server/index.js"
compatibility_date = "2025-09-01"
# build-market.mjs already bundles the worker with all assets embedded.
no_bundle = true

[[d1_databases]]
binding = "DB"
database_name = "tourmesh"
# Local dev works with any id. For deploy: `npx wrangler d1 create tourmesh` and paste the real id.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "drizzle"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "tourmesh-photos"
