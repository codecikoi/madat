# Local dev (`npm run dev`) and `wrangler d1` commands.
# Production runs on Cloudflare Pages with its own config: pages/wrangler.toml.
name = "tourmesh"
main = "dist/server/index.js"
compatibility_date = "2025-09-01"
# build-market.mjs already bundles the worker with all assets embedded.
no_bundle = true

[[d1_databases]]
binding = "DB"
database_name = "tourmesh"
database_id = "9c4f04ac-2f21-40bb-9223-fd9a0bd8fae9"
migrations_dir = "drizzle"

# Offer photos.
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "tourmesh-photos"

# Workers AI: turns a free-text request into a structured one.
[ai]
binding = "AI"
