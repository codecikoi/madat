# Cloudflare Pages deployment (https://tourmesh.pages.dev).
# `npm run deploy` copies the built worker to pages/dist/_worker.js and uploads it.
# Local dev uses the Workers config in ../wrangler.toml; keep database_id in sync.
name = "tourmesh"
pages_build_output_dir = "./dist"
compatibility_date = "2025-09-01"

[[d1_databases]]
binding = "DB"
database_name = "tourmesh"
database_id = "9c4f04ac-2f21-40bb-9223-fd9a0bd8fae9"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "tourmesh-photos"
